name: editor
root: ./
startup_window: editor
pre_window: export RMW_IMPLEMENTATION=rmw_zenoh_cpp; export UAV_NAME=uav1
windows:
  - editor:
      layout: tiled
      panes:
        - waitForCore && ros2 launch mrs_octomap_tools octomap_editor.launch.py
  - reconfigure:
      layout: tiled
      panes:
        - waitForCore && ros2 run rqt_reconfigure rqt_reconfigure
  - rviz:
      layout: tiled
      panes:
        - waitForCore && ros2 run rviz2 rviz2 -d ./octomap_editor.rviz --ros-args -p use_sim_time:=true
  - roscore:
      layout: tiled
      panes:
        - roscore
  - layout:
      layout: tiled
      panes:
        - waitForCore && sleep 3; ~/.i3/layout_manager.sh ./layout.json
